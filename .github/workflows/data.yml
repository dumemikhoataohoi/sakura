name: data

# Hourly macro/calendar refresh. The minute is offset from :00 because GitHub's
# scheduler is congested at the top of the hour.
on:
  schedule:
    - cron: "17 * * * *"
  workflow_dispatch:

permissions:
  contents: write   # commit data/ back to the default branch

concurrency:
  group: data-${{ github.ref }}
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      # Vault gate, first: fail fast on a missing / wrong key (vault.key_fp), an undecryptable .zv or a vault-set file
      # left in plaintext. Vault off and no .zv: passes without a key. The key is never printed.
      - name: Vault check
        env:
          ZUMI_KEY: ${{ secrets.ZUMI_KEY }}
        run: python scripts/vault.py check

      # ZUMI_KEY (repo secret, 64 hex): only on the steps that read / write vault files (scripts/vault.py).
      # It is passed as env and never echoed; GitHub also masks it in logs. Without vault.enabled it is unused.
      - name: Fetch FRED + calendar (+ optional gold), build data/latest.json
        id: build
        env:
          ZUMI_KEY: ${{ secrets.ZUMI_KEY }}
        run: python scripts/build_latest.py --msg-file "$RUNNER_TEMP/commit_msg.txt"

      - name: Weekly USD economic calendar (best effort, never fails the job)
        env:
          ZUMI_KEY: ${{ secrets.ZUMI_KEY }}
        run: python scripts/ff_calendar.py || true

      - name: Commit only when data changed
        env:
          TARGET_BRANCH: ${{ github.ref_name }}
          ZUMI_KEY: ${{ secrets.ZUMI_KEY }}   # the regenerate command (push race) re-runs build_latest.py
        run: |
          bash scripts/commit_push.sh "$RUNNER_TEMP/commit_msg.txt" \
            "python scripts/build_latest.py --msg-file $RUNNER_TEMP/commit_msg.txt" \
            data/

      # GitHub agent self-monitoring (docs/agents.md): reads repo files only, no event text, no extra permission.
      # Rewrites reports/agents/<UTC date>.md/.json only when a status, a reason or a KPI changed.
      - name: Agent health and daily KPIs (commit only on change)
        env:
          TARGET_BRANCH: ${{ github.ref_name }}
          ZUMI_KEY: ${{ secrets.ZUMI_KEY }}   # reads reports/coord, CHANGELOG, quality; writes reports/agents (vault)
        run: |
          python scripts/agents_status.py --msg-file "$RUNNER_TEMP/agents_msg.txt"
          bash scripts/commit_push.sh "$RUNNER_TEMP/agents_msg.txt" \
            "python scripts/agents_status.py --msg-file $RUNNER_TEMP/agents_msg.txt" \
            reports/agents/
